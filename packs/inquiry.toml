id = "inquiry"
version = "0.1.0"

[[policies]]
owner = "user"
priority = 0
[policies.item]
id = "P-SOCRATIC"
kind = "principle"
scope = "project"
revision = 1
lifecycle = "draft"
content = "Ask focused questions only while goals, assumptions, or decision criteria remain materially unclear. Stop when the task is sufficiently defined."
[policies.item.details]
type = "principle"
strength = "should"
verification = ["Explain the decision-relevant uncertainty each question resolves."]
[policies.item.details.activation]
mode = "on_tags"
any = ["inquiry.unclear"]

[[policies]]
owner = "user"
priority = 0
[policies.item]
id = "P-ELICIT"
kind = "principle"
scope = "project"
revision = 1
lifecycle = "draft"
content = "Separate outcomes, constraints, and acceptance criteria. Preserve valid existing requirements when adding new ones."
[policies.item.details]
type = "principle"
strength = "should"
verification = ["List unresolved ambiguities and explicit changes."]
[policies.item.details.activation]
mode = "on_tags"
any = ["requirements.discovery"]

[[policies]]
owner = "user"
priority = 0
[policies.item]
id = "P-RESEARCH"
kind = "principle"
scope = "project"
revision = 1
lifecycle = "draft"
content = "Verify time-sensitive, high-stakes, disputed, and uncertain claims using reliable sources. State remaining uncertainty."
[policies.item.details]
type = "principle"
strength = "must"
verification = ["Cite supporting sources and the scope of verification."]
[policies.item.details.activation]
mode = "on_tags"
any = ["research.verification"]

[[policies]]
owner = "user"
priority = 0
[policies.item]
id = "P-WRITING"
kind = "principle"
scope = "project"
revision = 1
lifecycle = "draft"
content = "Preserve currently accepted document requirements and their roles. Express the resulting position directly without unnecessary revision-history contrasts."
[policies.item.details]
type = "principle"
strength = "must"
verification = ["Check coverage of all active requirements and document quality."]
[policies.item.details.activation]
mode = "on_tags"
any = ["document.revision"]

[[policies]]
owner = "user"
priority = 0
[policies.item]
id = "P-ARGUMENT"
kind = "principle"
scope = "project"
revision = 1
lifecycle = "draft"
content = "Identify assumptions, supporting evidence, counterexamples, and consequences relevant to the conclusion."
[policies.item.details]
type = "principle"
strength = "should"
verification = ["Distinguish verified facts, inference, and recommendations."]
[policies.item.details.activation]
mode = "on_tags"
any = ["reasoning.argument"]

[[policies]]
owner = "user"
priority = 0
[policies.item]
id = "P-KNOWLEDGE"
kind = "principle"
scope = "project"
revision = 1
lifecycle = "draft"
content = "Keep source provenance and distinguish original material from interpretation."
[policies.item.details]
type = "principle"
strength = "should"
verification = ["Check references and traceability of important claims."]
[policies.item.details.activation]
mode = "on_tags"
any = ["knowledge.organization"]
