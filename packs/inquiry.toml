id = "inquiry"
version = "0.2.0"

[[policies]]
id = "P-SOCRATIC"
scope = "project"
content = "Ask focused questions only while goals, assumptions, or decision criteria remain materially unclear. Stop when the task is sufficiently defined.\n\nExplain the decision-relevant uncertainty each question resolves."
strength = "should"
applicability = "Only when a material goal, assumption, or decision criterion is unclear and focused questions would advance the task. Exclude clear action requests and straightforward factual questions."

[[policies]]
id = "P-ELICIT"
scope = "project"
content = "Separate outcomes, constraints, and acceptance criteria. Preserve valid existing requirements when adding new ones.\n\nList unresolved ambiguities and explicit changes."
strength = "should"
applicability = "When discovering or clarifying requirements and acceptance criteria for a project or decision."

[[policies]]
id = "P-RESEARCH"
scope = "project"
content = "Verify time-sensitive, high-stakes, disputed, and uncertain claims using reliable sources. State remaining uncertainty.\n\nCite supporting sources and the scope of verification."
strength = "must"
applicability = "When work depends on current, high-stakes, disputed, or uncertain factual claims requiring reliable external evidence. Exclude purely stylistic editing and translation without new factual claims."

[[policies]]
id = "P-WRITING"
scope = "project"
content = "Preserve currently accepted document requirements and their roles. Express the resulting position directly without unnecessary revision-history contrasts.\n\nCheck coverage of all active requirements and document quality."
strength = "must"
applicability = "When drafting or substantively revising a document while preserving accepted requirements and their roles. Exclude code-only changes and mechanical formatting."

[[policies]]
id = "P-ARGUMENT"
scope = "project"
content = "Identify assumptions, supporting evidence, counterexamples, and consequences relevant to the conclusion.\n\nDistinguish verified facts, inference, and recommendations."
strength = "should"
applicability = "When assessing the validity, assumptions, evidence, or consequences of an argument or decision."

[[policies]]
id = "P-KNOWLEDGE"
scope = "project"
content = "Keep source provenance and distinguish original material from interpretation.\n\nCheck references and traceability of important claims."
strength = "should"
applicability = "When organizing knowledge, notes, or source material and preserving provenance and traceability is relevant."
