id = "development"
version = "0.2.0"

[[policies]]
id = "P-TDD"
scope = "project"
content = "Use Red–Green–Refactor for testable behavior changes. Demonstrate the failing test before implementation, then passing tests.\n\nRecord the failing-before and passing-after commands and results."
strength = "must"
applicability = "When changing testable observable program behavior or fixing a defect. Exclude explanations, documentation-only edits, formatting, and behavior-preserving refactoring."

[[policies]]
id = "P-REFACTOR"
scope = "project"
content = "Preserve observable behavior while improving structure. Reclassify intended behavior changes before proceeding.\n\nCompare relevant behavior before and after the refactor."
strength = "must"
applicability = "When improving internal code structure while preserving observable behavior. Identify separately requested behavior changes instead of calling them refactoring."

[[policies]]
id = "P-DEBUG"
scope = "project"
content = "Reproduce the failure and test a concrete cause before changing code.\n\nRecord reproduction and the check that distinguishes the proposed cause."
strength = "should"
applicability = "When investigating an unexplained defect or failing behavior and identifying its cause. Exclude requests that only explain already established results."

[[policies]]
id = "P-REGRESSION"
scope = "project"
content = "Add a regression check at the layer where the defect occurred.\n\nShow the check detects the original failure."
strength = "should"
applicability = "When fixing a defect whose recurrence can be checked by a meaningful automated regression test."

[[policies]]
id = "P-REVIEW"
scope = "project"
content = "Review correctness and regressions against accepted requirements. Prioritize actionable findings with evidence.\n\nLink findings to a concrete trigger and affected behavior."
strength = "should"
applicability = "When reviewing an implementation, diff, or API for defects and regressions. Exclude work that merely drafts explanatory prose."

[[policies]]
id = "P-API"
scope = "project"
content = "Preserve supported API compatibility or explicitly document and authorize the breaking change.\n\nCheck affected callers and compatibility expectations."
strength = "must"
applicability = "When changing an API or externally consumed interface with existing compatibility expectations."

[[policies]]
id = "P-MUTATION"
scope = "project"
content = "Use mutation testing when it helps detect weak behavioral assertions.\n\nReport executed mutations and meaningful survivors when performed."
strength = "may"
applicability = "When evaluating or strengthening the ability of tests to detect behavior defects and mutation testing would provide useful evidence."
