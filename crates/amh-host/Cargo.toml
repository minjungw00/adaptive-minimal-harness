[package]
name = "amh-host"
version = "0.0.0"
edition.workspace = true
publish = false

[[bin]]
name = "amh-host"
path = "src/main.rs"

[dependencies]
sha2 = "0.11"
amh-core = { path = "../amh-core", features = ["signed-approvals"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ed25519-dalek = "3"
