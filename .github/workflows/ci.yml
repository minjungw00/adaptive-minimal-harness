name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tooling
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run unit tests
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: CLI smoke test
        run: |
          cargo run -p amh-cli --locked -- --help
          cargo run -p amh-cli --locked -- --version
          cargo run -p amh-cli --locked -- policy discover --help
      - name: Qualitative evaluation infrastructure checks
        env:
          AMH_EXECUTABLE: target/debug/amh
        run: python -m unittest discover -s tests -p 'test_qualitative_eval.py' -v
