name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tooling
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Temporary bootstrap aid: the tracked lockfile is refreshed by a later commit.
      - name: Resolve dependency lockfile
        run: |
          cargo generate-lockfile
          echo "::group::Cargo lockfile (base64)"
          base64 -w0 Cargo.lock
          echo
          echo "::endgroup::"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run unit tests
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: CLI smoke test
        run: |
          cargo run -p amh-cli --locked -- --help
          cargo run -p amh-cli --locked -- --version
