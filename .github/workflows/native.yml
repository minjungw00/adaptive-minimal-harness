name: Native CLI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Project workflow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: amh
          - os: macos-latest
            binary: amh
          - os: windows-latest
            binary: amh.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native project contracts and CLI
        run: cargo test -p amh-project -p amh-cli --locked
      - name: Build standalone executable
        run: cargo build -p amh-cli --release --locked
      - name: Check executable
        run: ./target/release/${{ matrix.binary }} --help
      - name: Package executable, examples and documentation
        shell: bash
        run: |
          package="amh-${{ runner.os }}-${{ runner.arch }}"
          mkdir -p "$package/examples"
          cp "target/release/${{ matrix.binary }}" "$package/"
          cp README.md "$package/"
          cp -R docs packs "$package/"
          cp -R examples/p0 "$package/examples/"
          tar -czf "$package.tar.gz" -C "$package" .
          python -c "import hashlib,pathlib; p=pathlib.Path('$package.tar.gz'); pathlib.Path('$package.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: amh-${{ runner.os }}-${{ runner.arch }}
          path: |
            amh-*.tar.gz
            amh-*.sha256
          if-no-files-found: error

  release-draft:
    name: Prepare reviewable native release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amh-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --title "$GITHUB_REF_NAME" --notes "Native AMH packages and checksums. Review license, supported platforms and release gates before publishing."
